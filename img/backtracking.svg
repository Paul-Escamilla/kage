<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <style>
    .node { fill: var(--ifm-background-color, white); stroke: currentColor; stroke-width: 2px; }
    .text { font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: currentColor; }
    .edge { stroke: currentColor; stroke-width: 2px; fill: none; marker-end: url(#arrow); }
    .edge-dash { stroke: currentColor; stroke-width: 2px; fill: none; stroke-dasharray: 6,6; marker-end: url(#arrow-dash); }
  </style>

  <line x1="300" y1="60" x2="160" y2="105" class="edge" />
  <line x1="300" y1="60" x2="440" y2="105" class="edge" />
  <line x1="150" y1="140" x2="85" y2="205" class="edge" />
  <line x1="150" y1="140" x2="215" y2="205" class="edge" />
  <line x1="450" y1="140" x2="385" y2="205" class="edge" />
  <line x1="450" y1="140" x2="515" y2="205" class="edge" />

  <path d="M 60 210 Q 30 160 130 125" class="edge-dash" />
  <path d="M 225 240 Q 150 260 145 145" class="edge-dash" />
  <path d="M 130 110 Q 100 50 280 45" class="edge-dash" />
  <path d="M 360 210 Q 330 160 430 125" class="edge-dash" />

  <circle cx="300" cy="40" r="20" class="node" />
  <text x="300" y="42" class="text">A</text>

  <circle cx="150" cy="120" r="20" class="node" />
  <text x="150" y="122" class="text">B</text>

  <circle cx="450" cy="120" r="20" class="node" />
  <text x="450" y="122" class="text">C</text>

  <circle cx="75" cy="220" r="20" class="node" />
  <text x="75" y="222" class="text">D</text>

  <circle cx="225" cy="220" r="20" class="node" />
  <text x="225" y="222" class="text">E</text>

  <circle cx="375" cy="220" r="20" class="node" />
  <text x="375" y="222" class="text">F</text>

  <circle cx="525" cy="220" r="20" class="node" />
  <text x="525" y="222" class="text">G</text>
</svg>

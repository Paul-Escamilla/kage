<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
    </marker>
  </defs>

  <style>
    .node { fill: #38a1db; stroke:currentColor; stroke-width: 1.5px; }
    .node.root { fill: var(--ifm-background-color, white); stroke:currentColor; }
    .text { font-family: sans-serif; font-size: 14px; text-anchor: middle; dominant-baseline: middle; fill: currentColor; }
    .edge { stroke: currentColor; stroke-width: 2px; fill: none; }
    .matching { stroke: currentColor; stroke-width: 1.5px; fill: none; stroke-dasharray: 6,6; }
  </style>

  <line x1="300" y1="40" x2="150" y2="120" class="edge" />
  <line x1="300" y1="40" x2="300" y2="120" class="edge" />
  <line x1="300" y1="40" x2="450" y2="120" class="edge" />
  
  <line x1="150" y1="120" x2="100" y2="200" class="edge" />
  <line x1="150" y1="120" x2="200" y2="200" class="edge" />
  <line x1="300" y1="120" x2="275" y2="200" class="edge" />
  <line x1="300" y1="120" x2="325" y2="200" class="edge" />
  <line x1="450" y1="120" x2="400" y2="200" class="edge" />
  <line x1="450" y1="120" x2="500" y2="200" class="edge" />

  <path d="M 100 200 Q 150 280 275 200" class="matching" />
  <path d="M 200 200 Q 300 320 400 200" class="matching" />
  <path d="M 325 200 Q 400 280 500 200" class="matching" />

  <circle cx="300" cy="40" r="15" class="node" />
  
  <circle cx="150" cy="120" r="15" class="node" />
  <circle cx="300" cy="120" r="15" class="node" />
  <circle cx="450" cy="120" r="15" class="node" />
  
  <circle cx="100" cy="200" r="12" class="node" />
  <circle cx="200" cy="200" r="12" class="node" />
  <circle cx="275" cy="200" r="12" class="node" />
  <circle cx="325" cy="200" r="12" class="node" />
  <circle cx="400" cy="200" r="12" class="node" />
  <circle cx="500" cy="200" r="12" class="node" />
</svg>
